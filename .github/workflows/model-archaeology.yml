name: MODEL archaeology invariants
on:
  pull_request:
    paths:
      - "archaeology/**"
      - ".github/workflows/model-archaeology.yml"
  push:
    branches: [main]
    paths:
      - "archaeology/**"
      - ".github/workflows/model-archaeology.yml"
permissions:
  contents: read
jobs:
  test-model-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate MODEL records and compare invariants
        run: python -m unittest discover -s archaeology/tests -v
